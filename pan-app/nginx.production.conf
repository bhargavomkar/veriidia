server {
    listen 10000;
    server_name _;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /_viewer_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/registration/viewer-authorized?ticket=$arg_ticket;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    location = /viewer/vnc.html {
        auth_request /_viewer_auth;
        access_log off;
        proxy_pass http://127.0.0.1:6080/vnc.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-cache always;
    }

    location = /viewer/websockify {
        auth_request /_viewer_auth;
        access_log off;
        proxy_pass http://127.0.0.1:6080/websockify;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /viewer/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        add_header Cache-Control no-cache always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
