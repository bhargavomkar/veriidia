services:
  pan-app:
    build: .
    environment:
      APP_ENV: local
      PROTEAN_AUTOMATED_SUBMISSION_PERMITTED: ${PROTEAN_AUTOMATED_SUBMISSION_PERMITTED:-false}
    shm_size: 1gb
    restart: unless-stopped
    expose:
      - "8000"
      - "6080"
    networks:
      - pan-local

  gateway:
    image: nginx:1.27-alpine
    depends_on:
      - pan-app
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - pan-local

networks:
  pan-local:
    driver: bridge
