services:
  - type: web
    name: veriidia-pan-backend
    runtime: docker
    plan: standard
    dockerfilePath: ./pan-app/Dockerfile
    dockerContext: ./pan-app
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: PROTEAN_AUTOMATED_SUBMISSION_PERMITTED
        value: "false"
      - key: REGISTRATION_SESSION_IDLE_TIMEOUT_SECONDS
        value: "900"
      - key: VERIIDIA_CORS_ORIGINS
        value: https://veriidiaprototype.vercel.app
      - key: DATABASE_URL
        sync: false
